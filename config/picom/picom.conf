# Opaque compositor profile for BSPWM/X11.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;

# Show, hide, focus and workspace changes must be immediate.
fading = false;

# Soft shadows around regular application windows.
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.55;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "fullscreen",
    "name = 'Notification'"
];

# Keep every application and frame fully opaque. Blur is intentionally disabled.
blur-background = false;
blur-background-frame = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.0;
frame-opacity = 1.0;
opacity-rule = [
    "100:fullscreen"
];

corner-radius = 14;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "fullscreen"
];
