# ML4W-inspired effects for BSPWM/X11.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;

# Smooth opacity changes and window open/close transitions.
fading = true;
fade-delta = 5;
fade-in-step = 0.055;
fade-out-step = 0.055;

# Soft shadows around regular application windows.
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.55;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "fullscreen",
    "name = 'Notification'"
];

# Blur is visible behind applications that provide transparency, such as Kitty.
blur-method = "gaussian";
blur-size = 25;
blur-deviation = 8.0;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "fullscreen"
];

# Previous rice profile: active-opacity 0.86, inactive-opacity 0.76, corner-radius 16.
active-opacity = 0.90;
inactive-opacity = 0.78;
inactive-dim = 0.08;
frame-opacity = 0.88;
opacity-rule = [
    "100:fullscreen"
];

corner-radius = 14;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "fullscreen"
];
