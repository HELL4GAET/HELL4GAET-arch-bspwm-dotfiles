[global/wm]
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini

; Setting up the main laptop monitor
[bar/top]
monitor = ${env:MONITOR:eDP}
width = 98%
height = 31
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
override-redirect = true
border-top-size = 4
border-bottom-size = 4
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 8
fixed-center = true
line-size = 4
wm-restack = bspwm

modules-left = filesystem bspwm
modules-center = temperature space space memory space space cpu
modules-right = battery backlight alsa xkeyboard time space bluetooth wlan powermenu

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=18;5
font-2 = JetBrainsMono Nerd Font:style=Bold:size=13;3
font-3 = Noto Sans:size=13:antialias=true;3

[bar/top-external]
inherit = bar/top
height = 54
offset-y = 14
padding-left = 2
font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=22;6
font-1 = JetBrainsMono Nerd Font:size=30;9
font-2 = JetBrainsMono Nerd Font:style=Bold:size=22;6
font-3 = Noto Sans:size=22:antialias=true;6
